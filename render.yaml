# Render 部署配置
# https://render.com/docs/yaml-spec

services:
  - type: web
    name: insarag-hub
    env: node
    region: singapore
    plan: free
    buildCommand: echo "No build step required"
    startCommand: node --no-warnings server.js
    envVars:
      - key: NODE_VERSION
        value: 22.14.0
      - key: BIGMODEL_KEY
        sync: false
      - key: DEEPSEEK_KEY
        sync: false
    healthCheckPath: /api/health
    autoDeploy: true
